{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Add New Vehicle</h2>
    <a href="{{ url_for('bookings.dashboard') }}" class="btn btn-outline-secondary">Back to Dashboard</a>
</div>

<div class="row">
    <div class="col-md-8">
        <div class="card">
            <div class="card-body">
                <form method="POST">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="license_plate" class="form-label">License Plate</label>
                            <input type="text" class="form-control" id="license_plate" name="license_plate" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="make" class="form-label">Make</label>
                            <input type="text" class="form-control" id="make" name="make" placeholder="e.g., Toyota" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="model" class="form-label">Model</label>
                            <input type="text" class="form-control" id="model" name="model" placeholder="e.g., Corolla" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="year" class="form-label">Year</label>
                            <input type="number" class="form-control" id="year" name="year" min="1990" max="2026" required>
                        </div>
                        
                        <!-- NEW FIELDS FROM PHASE A -->
                        <div class="col-md-6 mb-3">
                            <label for="fuel_type" class="form-label">Fuel Type</label>
                            <select class="form-control" id="fuel_type" name="fuel_type">
                                <option value="Petrol">Petrol</option>
                                <option value="Diesel">Diesel</option>
                                <option value="Hybrid">Hybrid</option>
                                <option value="Electric">Electric</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="seating_capacity" class="form-label">Seating Capacity</label>
                            <input type="number" class="form-control" id="seating_capacity" name="seating_capacity" value="5" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="color" class="form-label">Color</label>
                            <input type="text" class="form-control" id="color" name="color">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="current_mileage" class="form-label">Current Mileage (km)</label>
                            <input type="number" class="form-control" id="current_mileage" name="current_mileage" value="0">
                        </div>
                        <!-- END NEW FIELDS -->
                        
                        <div class="col-md-6 mb-3">
                            <label for="daily_rate" class="form-label">Daily Rate ($)</label>
                            <input type="number" step="0.01" class="form-control" id="daily_rate" name="daily_rate" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="status" class="form-label">Status</label>
                            <select class="form-control" id="status" name="status">
                                <option value="Available">Available</option>
                                <option value="Maintenance">Maintenance</option>
                            </select>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-primary mt-3">Add Vehicle</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
