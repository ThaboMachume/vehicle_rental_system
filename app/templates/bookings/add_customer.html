{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Add New Customer</h2>
    <a href="{{ url_for('bookings.dashboard') }}" class="btn btn-outline-secondary">Back to Dashboard</a>
</div>

<div class="row">
    <div class="col-md-8">
        <div class="card">
            <div class="card-body">
                <form method="POST">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="full_name" class="form-label">Full Name</label>
                            <input type="text" class="form-control" id="full_name" name="full_name" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="email" class="form-label">Email Address</label>
                            <input type="email" class="form-control" id="email" name="email" required>
                        </div>
                        
                        <!-- NEW: ID Number Field (Required for Phase A) -->
                        <div class="col-md-6 mb-3">
                            <label for="id_number" class="form-label">ID Number</label>
                            <input type="text" class="form-control" id="id_number" name="id_number" required>
                        </div>
                        
                        <!-- FIXED: Renamed license_number to drivers_license (Required for Phase A) -->
                        <div class="col-md-6 mb-3">
                            <label for="drivers_license" class="form-label">Driver's License Number</label>
                            <input type="text" class="form-control" id="drivers_license" name="drivers_license" required>
                        </div>
                        
                        <div class="col-md-6 mb-3">
                            <label for="phone" class="form-label">Phone Number</label>
                            <input type="text" class="form-control" id="phone" name="phone" required>
                        </div>
                        
                        <div class="col-md-12 mb-3">
                            <label for="address" class="form-label">Address</label>
                            <textarea class="form-control" id="address" name="address" rows="2"></textarea>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-primary mt-3">Add Customer</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
