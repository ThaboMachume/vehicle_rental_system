{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Vehicle Checkout</h2>
    <a href="{{ url_for('bookings.view_booking', booking_id=booking.booking_id) }}" class="btn btn-outline-secondary">Back to Booking</a>
</div>
<div class="row">
    <div class="col-md-8">
        <div class="card">
            <div class="card-body">
                <div class="alert alert-info">
                    <strong>Customer:</strong> {{ booking.customer.full_name }} | 
                    <strong>Vehicle:</strong> {{ booking.vehicle.make }} {{ booking.vehicle.model }}
                </div>
                <form method="POST">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="checkout_odometer" class="form-label">Starting Odometer (km)</label>
                            <input type="number" class="form-control" id="checkout_odometer" name="checkout_odometer" value="{{ booking.vehicle.current_mileage }}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="checkout_fuel_level" class="form-label">Fuel Level (%)</label>
                            <input type="number" step="0.1" class="form-control" id="checkout_fuel_level" name="checkout_fuel_level" value="100" required>
                        </div>
                        <div class="col-md-12 mb-3">
                            <label for="checkout_condition" class="form-label">Vehicle Condition / Damage Notes</label>
                            <textarea class="form-control" id="checkout_condition" name="checkout_condition" rows="3"></textarea>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary mt-3">Confirm Checkout</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
