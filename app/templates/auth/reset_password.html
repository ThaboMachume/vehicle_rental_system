{% extends "base.html" %}

{% block title %}Reset Password - VRMS{% endblock %}

{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="card shadow-lg" style="width: 100%; max-width: 450px;">
        <div class="card-header bg-success text-white text-center py-3">
            <h4 class="mb-0"><i class="bi bi-shield-lock"></i> Reset Your Password</h4>
            <small>Setting a new password for {{ user.username }}</small>
        </div>
        <div class="card-body p-4">
            <div class="alert alert-success small">
                <i class="bi bi-check-circle"></i> Identity verified. Set your new password below.
            </div>
            
            <form method="POST">
                <div class="mb-3">
                    <label for="new_password" class="form-label">New Password</label>
                    <input type="password" class="form-control" id="new_password" name="new_password" 
                           minlength="6" required autofocus>
                    <small class="text-muted">Minimum 6 characters</small>
                </div>
                <div class="mb-3">
                    <label for="confirm_password" class="form-label">Confirm New Password</label>
                    <input type="password" class="form-control" id="confirm_password" name="confirm_password" 
                           minlength="6" required>
                </div>
                <button type="submit" class="btn btn-success w-100">
                    <i class="bi bi-check-circle"></i> Reset Password
                </button>
            </form>
            
            <hr>
            <div class="text-center">
                <a href="{{ url_for('auth.login') }}" class="small">
                    <i class="bi bi-arrow-left"></i> Back to Login
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
