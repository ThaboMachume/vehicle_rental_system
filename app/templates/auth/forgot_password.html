{% extends "base.html" %}

{% block title %}Forgot Password - VRMS{% endblock %}

{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="card shadow-lg" style="width: 100%; max-width: 450px;">
        <div class="card-header bg-primary text-white text-center py-3">
            <h4 class="mb-0"><i class="bi bi-key"></i> Forgot Password</h4>
            <small>Verify your identity to reset</small>
        </div>
        <div class="card-body p-4">
            <p class="text-muted small text-center mb-4">
                Enter your username and employee ID to verify your identity.
            </p>
            
            <form method="POST">
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" class="form-control" id="username" name="username" required autofocus>
                </div>
                <div class="mb-3">
                    <label for="employee_id" class="form-label">Employee ID</label>
                    <input type="text" class="form-control" id="employee_id" name="employee_id" 
                           placeholder="e.g., EMP001" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 mb-3">
                    <i class="bi bi-check-circle"></i> Verify Identity
                </button>
            </form>
            
            <hr>
            <div class="text-center">
                <a href="{{ url_for('auth.login') }}" class="small">
                    <i class="bi bi-arrow-left"></i> Back to Login
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
